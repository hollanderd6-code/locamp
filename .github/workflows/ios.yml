# Compile les deux apps iOS sur un Mac de GitHub, a chaque modification
# de l'app ou du pont. Pas de signature : on verifie que le code compile,
# puis on lance l'app Locataire dans le simulateur et on capture l'ecran.
name: iOS

on:
  push:
    # Pas sur main : la branche a deja ete testee avant la fusion, et les
    # Mac de GitHub sont rares (une file d'attente bloquait les tests suivants).
    branches-ignore: [main]
    paths:
      - 'ios/**'
      - 'backend/public/natif.*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      appareil:
        description: "Simulateur : iPhone, ou iPad mini (taille proche de l'iPhone Duo deplie)"
        default: iPhone
        type: choice
        options: [iPhone, iPad mini]

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.appareil || 'iPhone' }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: macos-26
    # Les identifiants de test sont des secrets de l'environnement GitHub « Locamp ».
    environment: Locamp
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: LocampLocataire
            bundle: fr.locamp.portail
            sous: ios-locataire
          - app: LocampGestion
            bundle: fr.locamp.gestion
            sous: ios-gestion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m5 iPhone || true

      - name: XcodeGen
        run: |
          brew install xcodegen
          cd ios/Locamp && xcodegen generate

      - name: Paquets Swift (cache)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ios/Locamp/project.yml') }}

      - name: Compilation (${{ matrix.app }})
        run: |
          set -o pipefail
          cd ios/Locamp
          xcodebuild -project Locamp.xcodeproj -scheme ${{ matrix.app }} \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Erreurs de compilation
        if: failure()
        run: grep -E "error:" -A3 ios/Locamp/build.log | head -200 || true

      - name: Simulateur et captures
        env:
          LOCAMP_TEST_EMAIL: ${{ secrets.LOCAMP_TEST_EMAIL }}
          LOCAMP_TEST_MDP: ${{ secrets.LOCAMP_TEST_MDP }}
        run: |
          set -x
          cd ios/Locamp
          APP=$(find build/dd/Build/Products -name "${{ matrix.app }}.app" -maxdepth 3 | head -1)
          APPAREIL="${{ inputs.appareil || 'iPhone' }}"
          UDID=$(xcrun simctl list devices available -j | APPAREIL="$APPAREIL" python3 -c "
          import json,sys,os
          d=json.load(sys.stdin)['devices']
          voulu=('iPad mini',) if os.environ['APPAREIL']=='iPad mini' else ('iPhone 17 Pro','iPhone 16 Pro')
          print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith(voulu)))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p captures
          # LOCAMP_CAPTURE : pas d'alerte de notifications (elle resterait par-dessus les captures suivantes).
          SIMCTL_CHILD_LOCAMP_CAPTURE=1 xcrun simctl launch "$UDID" ${{ matrix.bundle }}
          sleep 12
          xcrun simctl io "$UDID" screenshot captures/01-connexion.png
          if [ -n "$LOCAMP_TEST_EMAIL" ]; then
            # Un seul lancement : l'app visite les ecrans et attend chaque capture.
            xcrun simctl terminate "$UDID" ${{ matrix.bundle }} || true
            SIMCTL_CHILD_LOCAMP_CAPTURE=1 SIMCTL_CHILD_LOCAMP_TEST_EMAIL="$LOCAMP_TEST_EMAIL" SIMCTL_CHILD_LOCAMP_TEST_MDP="$LOCAMP_TEST_MDP" \
              xcrun simctl launch "$UDID" ${{ matrix.bundle }}
            CACHES="$(xcrun simctl get_app_container "$UDID" ${{ matrix.bundle }} data)/Library/Caches"
            VU=""
            for i in $(seq 1 240); do
              E=$(cat "$CACHES/etape.txt" 2>/dev/null || true)
              if [ -n "$E" ] && [ "$E" != "$VU" ]; then
                VU="$E"
                [ "$E" = "fin" ] && break
                case "$E" in sombre-*) xcrun simctl ui "$UDID" appearance dark; sleep 2;; esac
                sleep 1
                T0=$(date +%s)
                xcrun simctl io "$UDID" screenshot "captures/02-$E.png"
                echo "::notice::capture $E en $(( $(date +%s) - T0 )) s"
                touch "$CACHES/ok-$E"
                [ "$E" = "echec-connexion" ] && break
              fi
              sleep 0.5
            done
            xcrun simctl ui "$UDID" appearance light
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "${{ matrix.app }}"' --style compact 2>/dev/null | grep -iE "error|fault|locamp" | tail -60 || true

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.sous }}${{ inputs.appareil == 'iPad mini' && '-grand-ecran' || '' }}
          path: ios/Locamp/captures
          if-no-files-found: ignore

      - name: Captures sur la branche captures-tests (compte de test, donnees fictives)
        if: always()
        env:
          DOSSIER: ios/Locamp/captures
          SOUS: ${{ matrix.sous }}${{ inputs.appareil == 'iPad mini' && '-grand-ecran' || '' }}
        run: |
          [ -d "$DOSSIER" ] || exit 0
          git config user.name "locamp-tests"; git config user.email "tests@locamp.invalid"
          TMP=$(mktemp -d); cp -R "$DOSSIER"/. "$TMP"/
          git stash -u -q || true
          if git fetch -q origin captures-tests; then git checkout -q -B captures-tests FETCH_HEAD; else git checkout -q --orphan captures-tests; git rm -rqf . || true; fi
          rm -rf "$SOUS"; mkdir -p "$SOUS"; cp -R "$TMP"/. "$SOUS"/
          git add -A "$SOUS"
          git commit -qm "Captures $SOUS ($GITHUB_SHA)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin captures-tests 2>/dev/null || true; git push -q origin HEAD:captures-tests && break; sleep 3; done
