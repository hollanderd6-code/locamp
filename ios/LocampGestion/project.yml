# Projet Xcode de l'app iOS native « Locamp Gestion ».
# Le .xcodeproj n'est pas suivi par Git : on le genere avec XcodeGen.
#   brew install xcodegen
#   cd ios/LocampGestion && xcodegen generate && open LocampGestion.xcodeproj
name: LocampGestion
options:
  bundleIdPrefix: fr.locamp
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: fr
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    LOCAMP_URL: "https://locamp.onrender.com/"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  LocampGestion:
    type: application
    platform: iOS
    sources:
      - path: LocampGestion
      # Copie embarquee du pont, injectee si le site deploye ne l'a pas.
      - path: ../../backend/public/natif.js
        buildPhase: resources
      - path: ../../backend/public/natif.css
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.locamp.gestion
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LocampGestion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # A renseigner dans Xcode (Signing & Capabilities) ou ici :
        # DEVELOPMENT_TEAM: XXXXXXXXXX
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
