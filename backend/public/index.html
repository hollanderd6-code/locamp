<!-- ================= ÉCRAN DE CONNEXION ================= -->
<div id="login-screen" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><img src="/logo.svg" alt="" width="64" height="64"></div>
      <div>
        <div class="brand-name">Locamp</div>
        <div class="brand-sub">L'outil des campings résidentiels</div>
      </div>
    </div>
    <form id="login-form" autocomplete="on">
      <label>E-mail
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label>Mot de passe
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Se connecter</button>
      <p id="login-error" class="form-error hidden"></p>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js?v=1792915000"></script>
<!-- Pont avec l'app iOS native : inerte dans un navigateur. -->
<script src="/natif.js?v=1792915000"></script>

<script>
/* ---- Service worker ----
   Enregistre APRES le chargement : s'installer pendant le premier affichage
   reviendrait a disputer la bande passante a ce que l'utilisateur attend.

   Pas sur localhost — pendant le developpement, un cache de coquille ne fait
   que masquer les modifications qu'on vient d'ecrire. */
if ('serviceWorker' in navigator
    && location.hostname !== 'localhost'
    && location.hostname !== '127.0.0.1') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (e) {
      console.warn('[PWA] enregistrement impossible :', e.message);
    });

    /* Une nouvelle version prend la main : on recharge une fois pour que
       l'utilisateur la voie. Sans le drapeau, deux onglets peuvent se
       recharger l'un l'autre indefiniment. */
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (sessionStorage.getItem('locamp_sw_recharge')) return;
      sessionStorage.setItem('locamp_sw_recharge', '1');
      location.reload();
    });
  });
}
</script>
