<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F231D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Locamp">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icone-180.png">
<title>Locamp — Gestion de camping résidentiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/marque.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ================= ÉCRAN DE CONNEXION ================= -->
<div id="login-screen" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><img src="/logo.svg" alt="" width="64" height="64"></div>
      <div>
        <div class="brand-name">Locamp</div>
        <div class="brand-sub">L'outil des campings résidentiels</div>
      </div>
    </div>
    <form id="login-form" autocomplete="on">
      <label>E-mail
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label>Mot de passe
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Se connecter</button>
      <p id="login-error" class="form-error hidden"></p>
    </form>
  </div>
</div>

<!-- ================= APPLICATION ================= -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <button id="nav-burger" class="nav-burger" aria-label="Menu">☰</button>

    <div class="sidebar-head">
      <a href="#/dashboard" class="brand brand-side" title="Retour au tableau de bord">
        <div class="brand-mark"><img src="/logo.svg" alt="" width="64" height="64"></div>
        <div class="brand-name">Locamp</div>
      </a>
      <div id="camping-switch" class="camping-switch hidden">
        <select id="camping-select" title="Camping actif"></select>
      </div>
      <div id="exercice-switch" class="camping-switch hidden">
        <select id="exercice-select" title="Exercice affiché"></select>
      </div>
    </div>

    <nav class="nav" id="nav-scroll">
      <div class="nav-grp">Exploitation</div>
      <a href="#/dashboard" data-nav="dashboard"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Tableau de bord</span></a>
      <a href="#/carte" data-nav="carte"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg><span>Carte du camping</span></a>
      <a href="#/emplacements" data-nav="emplacements"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 9v12"/><path d="M15 9v12"/></svg><span>Emplacements</span></a>
      <a href="#/residents" data-nav="residents"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.4 2.8-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6c2.7.1 4.4 1.7 5 4.6"/></svg><span>Résidents</span></a>
      <a href="#/signatures" data-nav="signatures"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5 19.5 9.5 8.5 20.5H3.5v-5z"/><path d="M12.5 6.5l5 5"/></svg><span>Signatures</span></a>
      <a href="#/messagerie" data-nav="messagerie"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-2.8A8 8 0 1 1 21 12z"/></svg><span>Messagerie</span> <span id="nav-msg-badge" class="hidden"></span></a>
      <a href="#/compteurs" data-nav="compteurs"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13l3.5-3.5"/><path d="M9 3.5h6"/></svg><span>Compteurs</span></a>

      <div class="nav-grp">Facturation</div>
      <a href="#/factures" data-nav="factures"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h9l4 4v15H6z"/><path d="M15 2.5v4h4"/><path d="M9 12h7"/><path d="M9 16h7"/></svg><span>Factures</span></a>
      <a href="#/reglements" data-nav="reglements"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 10h19"/><path d="M6.5 14.7h4"/></svg><span>Règlements</span></a>
      <a href="#/impayes" data-nav="impayes"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13"/><circle cx="12" cy="16.6" r=".4" fill="currentColor"/></svg><span>Impayés</span> <span id="nav-imp-badge" class="hidden"></span></a>
      <a href="#/compta" data-nav="compta"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="2.5" width="15" height="19" rx="2"/><path d="M8 6.5h8"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 14.5h.01M12 14.5h.01M16 14.5h.01M8 18h.01M12 18h.01M16 18h.01"/></svg><span>Comptabilité</span></a>

      <div class="nav-grp">Configuration</div>
      <a href="#/parametres" data-nav="parametres"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg><span>Paramètres</span></a>
      <a href="#/administration" data-nav="administration" id="nav-admin"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20 6v6c0 5-3.4 8.3-8 9.5C7.4 20.3 4 17 4 12V6z"/><path d="M9 12l2 2 4-4.5"/></svg><span>Administration</span></a>
    </nav>

    <div class="sidebar-foot">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Se déconnecter</button>
    </div>
  
  </aside>
  <main id="main" class="main"></main>
</div>

<!-- ================= PANNEAU LATÉRAL (fiche) ================= -->
<div id="drawer" class="drawer hidden">
  <div class="drawer-backdrop" onclick="closeDrawer()"></div>
  <div class="drawer-panel">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Fermer">×</button>
    <div id="drawer-content"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
